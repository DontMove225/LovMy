server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # This app's API routes intentionally end in ".php" (e.g. /api/faq.php)
    # even though no such file exists -- they're all handled by Laravel's
    # router via index.php. A naive `location ~ \.php$` would intercept those
    # incoming requests directly (regex locations win over try_files) and
    # 404 trying to execute a nonexistent file, so this only matches the
    # real front controller.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
