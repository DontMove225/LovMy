server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne JAMAIS intercepter les chemins gérés par le backend/app :
    # Traefik les route ailleurs (prio > landing), mais on reste défensif.
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
