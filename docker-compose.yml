services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lovmy-backend:local
    container_name: lovmy_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lovmy

  mysql:
    image: mysql:8.0
    container_name: lovmy_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lovmy

volumes:
  mysql-data:

networks:
  lovmy:
    driver: bridge
